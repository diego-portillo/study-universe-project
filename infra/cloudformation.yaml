AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ai-hub infrastructure — VPC and public subnets.
  Pre-existing resources (ECR, IAM roles, OIDC provider, ECS cluster) are
  documented in comments below as the authoritative record of what must
  exist in AWS for the deploy and teardown GitHub Actions workflows to
  function.

# ===========================================================================
# ACCOUNT / REGION
# ===========================================================================
# Account ID : 211125335109
# Region     : us-east-1
# Domain     : www.diegoportillo.dev
# GitHub repo: diego-portillo/study-universe-project  (branch: ai_hub → main)

# ===========================================================================
# GITHUB ACTIONS SECRETS  (Settings → Secrets → Actions)
# ===========================================================================
# Secret name                   Value
# ─────────────────────────────────────────────────────────────────────────────
# AWS_ROLE_ARN                  arn:aws:iam::211125335109:role/github-actions-ai-hub
# ECS_EXECUTION_ROLE_ARN        arn:aws:iam::211125335109:role/ai-hub-execution-role
# ECS_INFRA_ROLE_ARN            arn:aws:iam::211125335109:role/ai-hub-infra-role
# OPENAI_API_KEY                <your key>
# ANTHROPIC_API_KEY             <your key>
# GOOGLE_GENERATIVE_AI_API_KEY  <your key>
# ELEVENLABS_API_KEY            <your key>
# ─────────────────────────────────────────────────────────────────────────────

# ===========================================================================
# PRE-EXISTING RESOURCES  (not managed by this stack)
# ===========================================================================
#
# 1. ECR REPOSITORY
#    Name : ai-hub
#    ARN  : arn:aws:ecr:us-east-1:211125335109:repository/ai-hub
#    URI  : 211125335109.dkr.ecr.us-east-1.amazonaws.com/ai-hub
#
# 2. GITHUB OIDC IDENTITY PROVIDER
#    ARN  : arn:aws:iam::211125335109:oidc-provider/token.actions.githubusercontent.com
#
# 3. GITHUB ACTIONS ROLE  →  github-actions-ai-hub
#    ARN  : arn:aws:iam::211125335109:role/github-actions-ai-hub
#    Trust: repo:diego-portillo/study-universe-project:*  (OIDC)
#    Inline policy: ai-hub-deploy
#      ECR      — GetAuthorizationToken, BatchCheckLayerAvailability,
#                 GetDownloadUrlForLayer, BatchGetImage, InitiateLayerUpload,
#                 UploadLayerPart, CompleteLayerUpload, PutImage,
#                 ListImages, BatchDeleteImage
#      ECS      — ecs:* (full ECS access; Express Mode requires many undocumented
#                 actions that were discovered reactively, so wildcard is pragmatic
#                 for a single-account portfolio project)
#      CFN      — cloudformation:DescribeStacks (reads subnet IDs at deploy time)
#      Logs     — CreateLogGroup, DescribeLogGroups
#      PassRole — ai-hub-execution-role, ai-hub-infra-role
#
# 4. ECS TASK EXECUTION ROLE  →  ai-hub-execution-role
#    ARN    : arn:aws:iam::211125335109:role/ai-hub-execution-role
#    Trust  : ecs-tasks.amazonaws.com
#    Policy : AmazonECSTaskExecutionRolePolicy (AWS managed)
#
# 5. ECS EXPRESS MODE INFRASTRUCTURE ROLE  →  ai-hub-infra-role
#    ARN    : arn:aws:iam::211125335109:role/ai-hub-infra-role
#    Trust  : ecs.amazonaws.com
#    Policy : AmazonECSInfrastructureRoleforExpressGatewayServices (AWS managed)
#
# 6. ECS SERVICE-LINKED ROLE  →  AWSServiceRoleForECS
#    Created automatically by AWS on first ECS API call.
#
# 7. ECS CLUSTER  →  ai-hub
#    ARN  : arn:aws:ecs:us-east-1:211125335109:cluster/ai-hub
#    Capacity providers: FARGATE, FARGATE_SPOT (default strategy: FARGATE weight 1)
#    Lifecycle is intentionally NOT managed by this CFN stack: the deploy
#    workflow creates it (idempotent ecs:CreateCluster) if missing, and the
#    teardown workflow deletes it (ecs:DeleteCluster). Putting it in CFN
#    caused stack drift every teardown→deploy cycle, which broke
#    amazon-ecs-deploy-express-service with an opaque "Service Unavailable"
#    error when the cluster CFN thought existed had actually been deleted.

# ===========================================================================
# RESOURCES MANAGED BY THIS STACK
# ===========================================================================
Resources:

  # ── VPC ───────────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: ai-hub-vpc

  # ── Internet Gateway ──────────────────────────────────────────────────────
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: ai-hub-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ── Public subnets (2 AZs — ALB requires at least 2) ─────────────────────
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ai-hub-public-1a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: ai-hub-public-1b

  # ── Route table — sends all outbound traffic through the IGW ──────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: ai-hub-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

# ===========================================================================
# OUTPUTS — subnet IDs are queried dynamically by the deploy workflow
# ===========================================================================
Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC

  PublicSubnet1Id:
    Description: Public subnet in us-east-1a
    Value: !Ref PublicSubnet1

  PublicSubnet2Id:
    Description: Public subnet in us-east-1b
    Value: !Ref PublicSubnet2

  SubnetList:
    Description: Comma-separated subnet IDs for the ECS Express Mode action
    Value: !Sub "${PublicSubnet1},${PublicSubnet2}"
