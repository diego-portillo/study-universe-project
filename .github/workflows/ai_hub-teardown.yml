name: AI Hub — Teardown

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_SERVICE: ai-hub
  ECS_CLUSTER: ai-hub
  ECR_REPOSITORY: ai-hub

jobs:
  teardown:
    name: Delete ECS Express Mode service + cluster
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete ECS service
        run: |
          echo "Scaling service to 0 (idempotent — skips if service/cluster not found)..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 0 2>/dev/null || true

          echo "Deleting ECS service..."
          if aws ecs delete-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force 2>/dev/null; then
            echo "✅ Service deleted. Fargate task billing stops immediately."
          else
            echo "Service '$ECS_SERVICE' not found or already deleted — nothing to do."
          fi

      - name: Delete ECS cluster
        run: |
          if aws ecs delete-cluster --cluster "$ECS_CLUSTER" 2>/dev/null; then
            echo "✅ Cluster '$ECS_CLUSTER' deleted."
          else
            echo "Cluster '$ECS_CLUSTER' not found or already deleted — nothing to do."
          fi

      - name: Verify ALB cleanup
        run: |
          echo ""
          echo "⚠️  ECS Express Mode provisions an ALB shared across up to 25 services."
          echo "    Verify in the AWS Console (EC2 → Load Balancers) that no orphaned"
          echo "    listener rules or target groups remain for '$ECS_SERVICE'."
          echo "    The shared ALB itself persists if other Express Mode services use it."
