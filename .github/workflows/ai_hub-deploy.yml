name: AI Hub — Deploy

on:
  # Auto-deploy when ai_hub/ changes land on main
  push:
    branches: [main]
    paths:
      - "ai_hub/**"
      - ".github/workflows/ai_hub-deploy.yml"

  # Manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-hub
  ECS_SERVICE: ai-hub
  ECS_CLUSTER: ai-hub
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build → ECR → ECS Express Mode
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for OIDC auth with AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ./ai_hub
          push: true
          # No base path — ECS Express serves at root; reverse-proxy subpath routing is a separate Block D task
          build-args: NEXT_PUBLIC_BASE_PATH=
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get subnets from CloudFormation
        id: cfn
        run: |
          SUBNETS=$(aws cloudformation describe-stacks \
            --stack-name ai-hub-infra \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='SubnetList'].OutputValue" \
            --output text)
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT

      - name: Ensure ECS cluster exists
        run: |
          STATUS=$(aws ecs describe-clusters --clusters ${{ env.ECS_CLUSTER }} --region ${{ env.AWS_REGION }} \
            --query "clusters[0].status" --output text)
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "Cluster '${{ env.ECS_CLUSTER }}' already active."
          else
            echo "Cluster '${{ env.ECS_CLUSTER }}' status is '$STATUS' — creating..."
            aws ecs create-cluster \
              --cluster-name ${{ env.ECS_CLUSTER }} \
              --region ${{ env.AWS_REGION }} \
              --capacity-providers FARGATE FARGATE_SPOT \
              --default-capacity-provider-strategy capacityProvider=FARGATE,weight=1
          fi

      - name: Deploy to ECS Express Mode
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-express-service@v1
        with:
          service-name: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          execution-role-arn: ${{ secrets.ECS_EXECUTION_ROLE_ARN }}
          infrastructure-role-arn: ${{ secrets.ECS_INFRA_ROLE_ARN }}
          container-port: 3000
          cpu: 1024
          memory: 2048
          health-check-path: /
          subnets: ${{ steps.cfn.outputs.subnets }}
          environment-variables: >-
            [
              {"name": "OPENAI_API_KEY",                      "value": "${{ secrets.OPENAI_API_KEY }}"},
              {"name": "ANTHROPIC_API_KEY",                   "value": "${{ secrets.ANTHROPIC_API_KEY }}"},
              {"name": "GOOGLE_GENERATIVE_AI_API_KEY",        "value": "${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}"},
              {"name": "ELEVENLABS_API_KEY",                  "value": "${{ secrets.ELEVENLABS_API_KEY }}"},
              {"name": "OPENAI_MODEL",                        "value": "${{ secrets.OPENAI_MODEL }}"},
              {"name": "OPENAI_IMAGE_MODEL",                  "value": "${{ secrets.OPENAI_IMAGE_MODEL }}"},
              {"name": "OPENAI_VISION_MODEL",                 "value": "${{ secrets.OPENAI_VISION_MODEL }}"},
              {"name": "OPENAI_MAX_TOKENS",                   "value": "${{ secrets.OPENAI_MAX_TOKENS }}"},
              {"name": "OPENAI_AUDIO_TRANSCRIPTION_MODEL",    "value": "${{ secrets.OPENAI_AUDIO_TRANSCRIPTION_MODEL }}"},
              {"name": "OPENAI_AUDIO_GENERATION_MODEL",       "value": "${{ secrets.OPENAI_AUDIO_GENERATION_MODEL }}"},
              {"name": "ANTHROPIC_MODEL",                     "value": "${{ secrets.ANTHROPIC_MODEL }}"},
              {"name": "ANTHROPIC_MAX_TOKENS",                "value": "${{ secrets.ANTHROPIC_MAX_TOKENS }}"},
              {"name": "GEMINI_MODEL",                        "value": "${{ secrets.GEMINI_MODEL }}"}
            ]

      - name: Print service endpoint
        run: |
          echo ""
          echo "✅ Deployed: https://${{ steps.deploy.outputs.endpoint }}"
          echo "SERVICE_URL=https://${{ steps.deploy.outputs.endpoint }}" >> $GITHUB_STEP_SUMMARY
