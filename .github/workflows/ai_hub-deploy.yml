name: AI Hub — Deploy

on:
  # Auto-deploy when ai_hub/ changes land on main
  push:
    branches: [main]
    paths:
      - "ai_hub/**"
      - ".github/workflows/ai_hub-deploy.yml"

  # Manual trigger from GitHub UI (Actions tab → Run workflow)
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-hub
  APP_RUNNER_SERVICE: ai-hub

jobs:
  deploy:
    name: Build → ECR → App Runner
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for OIDC auth with AWS
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ./ai_hub
          push: true
          # No base path — App Runner serves at root, no reverse proxy
          build-args: NEXT_PUBLIC_BASE_PATH=
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to App Runner
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          # Check if the service already exists
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE'].ServiceArn" \
            --output text)

          if [ -z "$SERVICE_ARN" ]; then
            echo "Creating new App Runner service..."
            aws apprunner create-service \
              --service-name "$APP_RUNNER_SERVICE" \
              --source-configuration "{
                \"ImageRepository\": {
                  \"ImageIdentifier\": \"$IMAGE_URI\",
                  \"ImageConfiguration\": {
                    \"Port\": \"3000\",
                    \"RuntimeEnvironmentSecrets\": {
                      \"OPENAI_API_KEY\":              \"${{ secrets.OPENAI_API_KEY }}\",
                      \"ANTHROPIC_API_KEY\":           \"${{ secrets.ANTHROPIC_API_KEY }}\",
                      \"GOOGLE_GENERATIVE_AI_API_KEY\":\"${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}\",
                      \"ELEVENLABS_API_KEY\":          \"${{ secrets.ELEVENLABS_API_KEY }}\"
                    }
                  },
                  \"ImageRepositoryType\": \"ECR\"
                },
                \"AutoDeploymentsEnabled\": false
              }" \
              --instance-configuration "Cpu=0.25 vCPU,Memory=0.5 GB" \
              --health-check-configuration "Protocol=HTTP,Path=/,Interval=10,Timeout=5,HealthyThreshold=2,UnhealthyThreshold=3"
          else
            echo "Updating existing App Runner service..."
            aws apprunner update-service \
              --service-arn "$SERVICE_ARN" \
              --source-configuration "{
                \"ImageRepository\": {
                  \"ImageIdentifier\": \"$IMAGE_URI\",
                  \"ImageConfiguration\": {
                    \"Port\": \"3000\",
                    \"RuntimeEnvironmentSecrets\": {
                      \"OPENAI_API_KEY\":              \"${{ secrets.OPENAI_API_KEY }}\",
                      \"ANTHROPIC_API_KEY\":           \"${{ secrets.ANTHROPIC_API_KEY }}\",
                      \"GOOGLE_GENERATIVE_AI_API_KEY\":\"${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}\",
                      \"ELEVENLABS_API_KEY\":          \"${{ secrets.ELEVENLABS_API_KEY }}\"
                    }
                  },
                  \"ImageRepositoryType\": \"ECR\"
                }
              }"
          fi

      - name: Wait for deployment and print URL
        run: |
          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE'].ServiceArn" \
            --output text)

          echo "Waiting for service to be RUNNING..."
          aws apprunner wait service-running --service-arn "$SERVICE_ARN" 2>/dev/null || true

          URL=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --query "Service.ServiceUrl" \
            --output text)

          echo ""
          echo "✅ Deployed: https://$URL"
          echo "SERVICE_URL=https://$URL" >> $GITHUB_STEP_SUMMARY
