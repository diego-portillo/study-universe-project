name: AI Hub — CI

on:
  push:
    paths:
      - "ai_hub/**"
      - ".github/workflows/ai_hub-*.yml"
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect ai_hub changes
    runs-on: ubuntu-latest
    outputs:
      ai_hub: ${{ steps.filter.outputs.ai_hub }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai_hub:
              - 'ai_hub/**'
              - '.github/workflows/ai_hub-*.yml'

  test:
    name: Lint + Tests
    needs: changes
    # On a direct push, the "paths" filter above already guarantees relevance;
    # on a pull_request, only run the real checks when ai_hub actually changed —
    # a skipped job still satisfies this as a required status check.
    if: github.event_name == 'push' || needs.changes.outputs.ai_hub == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_hub

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ai_hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

  docker-build:
    name: Docker Build (smoke check)
    needs: changes
    runs-on: ubuntu-latest
    # Only build the image on PRs targeting main that actually touch ai_hub —
    # confirms it compiles before merge. On feature branch pushes, lint+tests above are enough.
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && needs.changes.outputs.ai_hub == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./ai_hub
          push: false
          # No NEXT_PUBLIC_BASE_PATH — ECS Express serves at root
          build-args: NEXT_PUBLIC_BASE_PATH=
          cache-from: type=gha
          cache-to: type=gha,mode=max
