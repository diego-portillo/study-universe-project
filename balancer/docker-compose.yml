services:
  web:
    image: nginx:latest
    ports:
      - "80:80"
    deploy:
      replicas: 3 
      # this part programs the launch of a new replica if one of the existing ones fails
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure
    networks:
      - frontend

  app:
    image: frontend:latest
    deploy:
      replicas: 5
      restart_policy:
        condition: any
    networks:
      - frontend
      - backend

# Overlay network is the default for orchestrators
networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay
